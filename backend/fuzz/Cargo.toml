# cargo-fuzz targets for the decoders in genzo-imgio and genzo-color. Needs nightly:
#   cargo +nightly fuzz run sniff
# Every new decoder gets a target here.

[package]
name = "genzo-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Default features (heic, dng) plus raw: rawler, whose lossless JPEG
# decompressor the DNG reader uses, is fuzzed through it too.
genzo-imgio = { path = "../crates/imgio", features = ["raw"] }
genzo-color = { path = "../crates/color" }

[[bin]]
name = "sniff"
path = "fuzz_targets/sniff.rs"
test = false
doc = false
bench = false

[workspace]

# The HEIC decoder: genzo-heif, libheif and libde265. For coverage inside the
# C code, build them instrumented, e.g.
#   CFLAGS=-fsanitize=fuzzer-no-link CXXFLAGS=-fsanitize=fuzzer-no-link \
#     cargo +nightly fuzz run heic_decode
# Without that, libFuzzer only sees the Rust side and finds shallow crashes.
[[bin]]
name = "heic_decode"
path = "fuzz_targets/heic_decode.rs"
test = false
doc = false
bench = false

# The linear DNG reader (ProRAW, JPEG XL tiles). Start from the committed
# seeds (written by the imgio test `write_fuzz_seeds`):
#   cargo +nightly fuzz run dng_linear seeds/dng_linear
[[bin]]
name = "dng_linear"
path = "fuzz_targets/dng_linear.rs"
test = false
doc = false
bench = false

# imgio::decode, the path the pipeline uses: format sniffing, routing, the
# stage 0 metadata (levels, color tags, opcode lists) and every decoder
# behind it. Start from the DNG seeds:
#   cargo +nightly fuzz run decode seeds/dng_linear
[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

# rawler 0.8.0 with Genzo's patch, as in backend/Cargo.toml (vendor/README.md).
[patch.crates-io]
rawler = { path = "../vendor/rawler" }

# The non-RAW decoders, one target each, through imgio::decode and only on
# their own format. Seeds are copies of crates/imgio/tests/fixtures/images:
#   cargo +nightly fuzz run jpeg seeds/jpeg   (and png, tiff)
[[bin]]
name = "jpeg"
path = "fuzz_targets/jpeg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "png"
path = "fuzz_targets/png.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tiff"
path = "fuzz_targets/tiff.rs"
test = false
doc = false
bench = false

# imgio::decode_preview: the embedded-preview scan and decode. Seeds: the
# dng_linear, jpeg and tiff seeds together.
[[bin]]
name = "preview"
path = "fuzz_targets/preview.rs"
test = false
doc = false
bench = false

# An embedded ICC profile into stage 4's curves and matrix
# (genzo_color::encoding, moxcms underneath). Seeds are written by the color
# test `write_fuzz_seeds`:
#   cargo +nightly fuzz run icc seeds/icc
[[bin]]
name = "icc"
path = "fuzz_targets/icc.rs"
test = false
doc = false
bench = false

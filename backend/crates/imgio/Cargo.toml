[package]
name = "genzo-imgio"
description = "Decode and encode RAW, DNG, HEIC, JPEG, TIFF, PNG; read EXIF, XMP, IPTC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["heic", "dng"]
# HEIC and HEIF decoding through the bundled libheif and libde265 (LGPL-3.0,
# HEVC). Turning this off removes all native image code from the build; see
# docs/licenses.md for how to cut HEIC support completely.
heic = ["dep:genzo-heif"]
# The linear DNG reader (src/dng.rs): ProRAW and other LinearRaw DNGs,
# including JPEG XL tiles (DNG 1.7). Pure Rust (jxl-oxide, MIT OR Apache-2.0).
dng = ["dep:jxl-oxide"]
# RAW and CFA DNG decoding through rawler (LGPL-2.1, pure Rust), and the
# lossless JPEG tiles of iPhone 12 to 15 Pro ProRAW. Implies `dng`.
raw = ["dep:rawler", "dng"]

[dependencies]
genzo-model.workspace = true
genzo-heif = { workspace = true, optional = true }
rawler = { workspace = true, optional = true }
thiserror.workspace = true
rayon.workspace = true
jpeg-encoder.workspace = true
zune-jpeg.workspace = true
zune-core.workspace = true
png.workspace = true
tiff.workspace = true
memchr.workspace = true
# Pure-Rust JPEG XL decoder for DNG 1.7 tiles (iPhone 16 Pro ProRAW, Samsung Expert RAW). Pinned exactly: it parses untrusted files.
jxl-oxide = { version = "=0.12.6", default-features = false, features = ["rayon"], optional = true }

[[example]]
name = "raw_gap_report"
required-features = ["raw"]

[[example]]
name = "dng_jxl_probe"
required-features = ["dng"]

[[example]]
name = "cfa_report"
required-features = ["raw"]

[[example]]
name = "dng_inventory"
required-features = ["dng"]

[dev-dependencies]
genzo-golden.workspace = true
criterion.workspace = true

[[bench]]
name = "decode"
harness = false
required-features = ["raw"]


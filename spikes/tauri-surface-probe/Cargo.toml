# Probe 1b of docs/native-surface-spike.md: the occlusion probe's arrangement
# (opaque window, transparent webview, wgpu surface on the window's HWND)
# built through Tauri's own API. Own workspace; Cargo.lock is the shell's.
[package]
name = "tauri-surface-probe"
version = "0.0.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = "2.7"

[dependencies]
# macos-private-api: a transparent webview on macOS needs it (and the matching
# macOSPrivateApi in tauri.conf.json); the feature does nothing elsewhere.
tauri = { version = "=2.12.3", features = ["unstable", "macos-private-api"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["wgsl", "dx12", "vulkan", "std"] }
pollster = "0.4"
genzo-pipeline = { path = "../../backend/crates/pipeline" }
genzo-model = { path = "../../backend/crates/model" }
genzo-color = { path = "../../backend/crates/color" }

[workspace]

# As in shell/Cargo.toml.
[patch.crates-io]
rawler = { path = "../../backend/vendor/rawler" }

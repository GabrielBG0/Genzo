name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  MACOSX_DEPLOYMENT_TARGET: "13.0"
# libheif and libde265 are git submodules, built with CMake (present on all runners).

# Minimum OS versions (docs/development-plan.md, Decided): Windows 10 and 11,
# macOS 13, Linux with WebKitGTK 4.1 (Ubuntu 22.04). Builds run on the oldest
# runner images GitHub offers; there are no Windows 10 or macOS 13 runners, so
# macOS builds target 13.0 and those two OSes are checked by hand.

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple silicon, macos-15-intel is Intel.
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      # The snapshot test covers this too; the cli check gives a clearer message.
      - run: cargo run --locked -q -p genzo-cli -- contract check
      # HEIC can be cut; keep the build without it compiling.
      - if: runner.os == 'Linux'
        run: |
          cargo check --locked -p genzo-engine --no-default-features
          cargo test --locked -p genzo-imgio --no-default-features
      # TODO(0.D): GPU golden-image tests on lavapipe (mesa-vulkan-drivers) on every push,
      # real GPUs nightly. No GPU code exists yet.
      # TODO(0.A step 9): compare `genzo-cli bench` p95 against stored baselines and fail
      # on a regression above 10 percent.

  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/check-architecture.py

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    strategy:
      matrix:
        manifest: [backend/Cargo.toml, shell/Cargo.toml]
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}
          arguments: --all-features --config deny.toml
          command: check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  shell:
    name: Shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend
      - run: cargo clippy --locked
        working-directory: shell

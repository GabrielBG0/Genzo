name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  MACOSX_DEPLOYMENT_TARGET: "13.0"
# libheif and libde265 are git submodules, built with CMake (present on all runners).

# Minimum OS versions (docs/development-plan.md, Decided): Windows 10 and 11,
# macOS 13, Linux with WebKitGTK 4.1 (Ubuntu 22.04). Builds run on the oldest
# runner images GitHub offers; there are no Windows 10 or macOS 13 runners, so
# macOS builds target 13.0 and those two OSes are checked by hand.

jobs:
  # Lists the changed files and decides which jobs below they need: a frontend
  # change skips the backend jobs and the other way round, documentation skips
  # everything, and an unknown file runs everything (scripts/ci-changes.py).
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      gpu: ${{ steps.filter.outputs.gpu }}
      bench: ${{ steps.filter.outputs.bench }}
      architecture: ${{ steps.filter.outputs.architecture }}
      deny: ${{ steps.filter.outputs.deny }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request checks out its merge commit, whose first parent is the
          # base branch, so two commits are enough there.
          fetch-depth: 2
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base=HEAD^1
          else
            base="$BEFORE"
            git fetch -q --depth=1 origin "$base" || true
          fi
          python3 scripts/ci-changes.py "$base" HEAD >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple silicon, macos-15-intel is Intel.
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      # The snapshot test covers this too; the cli check gives a clearer message.
      - run: cargo run --locked -q -p genzo-cli -- contract check
      # HEIC can be cut; keep the build without it compiling.
      - if: runner.os == 'Linux'
        run: |
          cargo check --locked -p genzo-engine --no-default-features
          cargo test --locked -p genzo-imgio --no-default-features
      # The raw feature (rawler) is off by default but carries the DNG
      # reader's lossless JPEG path; test and lint it too.
      - if: runner.os == 'Linux'
        run: |
          cargo clippy --locked -p genzo-imgio --all-targets --features raw
          cargo test --locked -p genzo-imgio --features raw
      # GPU tests run here on whatever adapter the runner has (WARP on Windows,
      # Metal on macOS) and are skipped without one; the gpu job below requires
      # the reference device.
      # The performance gate runs in the gpu job below, on the reference device.

  gpu:
    name: GPU tests (lavapipe)
    needs: changes
    if: needs.changes.outputs.gpu == 'true'
    runs-on: ubuntu-22.04
    env:
      # lavapipe is the golden-image reference device. Fail instead of skipping
      # if it is missing.
      GENZO_ADAPTER: software
      GENZO_REQUIRE_GPU: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - run: vulkaninfo --summary
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo test --locked -p genzo-pipeline -p genzo-engine -- --nocapture
      # Performance gate: p95 of each stage against benchmarks/baseline-lavapipe.json,
      # fail on a regression above 10 percent. Three runs, lowest p95 wins, to filter
      # out noise from the shared runner. Without a baseline the step only warns.
      - name: Benchmark (3 runs)
        if: needs.changes.outputs.bench == 'true'
        run: |
          for i in 1 2 3; do
            cargo run --locked --release -q -p genzo-cli -- bench gpu 4032 3024 30 --json "$RUNNER_TEMP/bench-$i.json"
          done
      - name: Compare with the baseline
        if: needs.changes.outputs.bench == 'true'
        working-directory: .
        run: python3 scripts/check-bench.py benchmarks/baseline-lavapipe.json "$RUNNER_TEMP"/bench-?.json
      - name: Merge runs into a candidate baseline
        if: always() && needs.changes.outputs.bench == 'true'
        working-directory: .
        run: python3 scripts/check-bench.py --update "$RUNNER_TEMP/baseline-candidate.json" "$RUNNER_TEMP"/bench-?.json
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.bench == 'true'
        with:
          name: bench-lavapipe
          path: ${{ runner.temp }}/baseline-candidate.json

  architecture:
    name: Architecture rules
    needs: changes
    if: needs.changes.outputs.architecture == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/check-architecture.py

  deny:
    name: Licenses and advisories
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        manifest: [backend/Cargo.toml, shell/Cargo.toml]
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}
          arguments: --all-features --config deny.toml
          command: check

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  shell:
    name: Shell (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend
      - run: cargo clippy --locked
        working-directory: shell

  # The one check main's ruleset requires. Jobs skipped for a docs-only change
  # count as passed; a failed or cancelled job fails it.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, backend, gpu, architecture, deny, frontend, shell]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required job failed or was cancelled."
          exit 1
      - run: echo "Every job passed or was not needed."

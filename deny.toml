# cargo-deny configuration, shared by backend/ and shell/.
#   cargo deny --manifest-path backend/Cargo.toml --config deny.toml check
#   cargo deny --manifest-path shell/Cargo.toml --config deny.toml check
#
# Every license allowed here is compatible with GPL-3.0. The reasoning and the
# review of the not-yet-adopted native libraries live in docs/licenses.md.
# LGPL libraries (rawler, LibRaw, libheif, libde265) are not allowed until
# that review is signed off.

[graph]
all-features = false

[advisories]
yanked = "deny"
ignore = [
  # proc-macro-error is unmaintained. A build-time proc macro, pulled in by the
  # gtk-rs 0.18 bindings under Tauri on Linux. No fix until Tauri moves off gtk3.
  { id = "RUSTSEC-2024-0370", reason = "build-time only, via tauri -> gtk 0.18; no upgrade available" },
]

[licenses]
confidence-threshold = 0.9
# One config serves two workspaces, so not every allowed license appears in each.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  # Weak copyleft, file-level; compatible with GPL-3.0 (MPL-2.0 section 3.3).
  # Used by cssparser and selectors in the Tauri tree.
  "MPL-2.0",
]

[licenses.private]
# Genzo's own crates are GPL-3.0-only and never published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
